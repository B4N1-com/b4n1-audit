# release.conf — parámetros de release del SDK `b4n1-audit`.
#
# TODO lo que es específico de ESTE crate vive aquí; el flujo genérico
# (bump / publish / verify) vive en `bash/cli-sdk.sh` (task 952f7022).
# Motivo: antes había 3 copias divergentes (b4n1-web / b4n1-boost / b4n1-suite)
# con paths y nombres de paquete hardcodeados. Aquí solo datos, cero lógica.
#
# Uso: bash cli.sh sdk {bump|publish|verify|status} b4n1-audit [--dry-run]

VERSION=0.1.6

# Registros habilitados para ESTE SDK. Es una whitelist: `sdk publish` con un
# registro no listado falla loud (estado 3 de la matriz §2a), nunca lo omite.
# El orden es el orden de publicación.
REGISTRIES="pypi npm nuget"

# Nombres de paquete por registro.
# PROVISIONALES: decisión de fase privada pendiente en esta misma task — no
# publicar hasta fijarlos (ver pyproject.toml).
PYPI_NAME=b4n1-audit
NPM_NAME=b4n1-audit
NUGET_NAME=B4n1Audit
MAVEN_GROUP=com.b4n1
MAVEN_ARTIFACT=b4n1-audit

# El .csproj vive en csharp/src/ (igual que web/net); `dotnet pack` necesita el dir del proyecto.
DIR_nuget="csharp/src"

# Ficheros que llevan la versión y que `sdk bump` actualiza.
# Cada uno DEBE existir y DEBE contener $VERSION actual: si no, bump aborta
# (estado 3: "debe existir y no está"), en vez de dejar la versión a medias.
BUMP_FILES="python/pyproject.toml python/b4n1audit/core.py javascript/package.json csharp/src/B4n1Audit.csproj java/pom.xml"

# Maven retirado (owner 2026-11-22): Central sigue bloqueado; el JAR se
# distribuye por GitHub, igual que PHP y Go. El resto de registros se mantiene.
